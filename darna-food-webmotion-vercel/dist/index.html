Object.assign(T.fr,{wel:"Marhba bikom. Dkhlou, rakom f darkom.",st_t:"Darna : chez nous, chez vous",st_p1:"Dans une maison marocaine, personne ne mange seul. On ajoute un verre, on rompt le pain, on sert le thé avant même de demander ce qui vous amène.",st_p2:"Darna veut garder ce réflexe : un tajine qui mijote doucement, une table où l'on se rapproche, une porte ouverte à tous, quel que soit le budget.",s1t:"L'idée",s1p:"Le nom dit tout : darna, c'est « notre maison ». Pas un décor de restaurant, l'envie de recevoir comme on reçoit chez soi.",s2t:"Les valeurs de la maison",s2p:"Partager d'abord, faire de la place à chacun, ne jamais presser une table. Un proverbe nous guide : « Li 3ndo yakoul, w li ma 3ndouch hta howa yakoul. » C'est un esprit, pas une offre.",s3t:"La cuisine",s3p:"Une tanjia confite des heures, des tajines cuits dans la terre, du pain sorti du four. Et pour les soirs pressés, tacos, pizzas et burgers faits avec le même soin.",s4t:"Notre promesse",s4p:"En famille, entre amis ou seul : une place vous attend à table, des portions franches et un accueil sans façon.",st_note:"Récit de marque proposé pour ce prototype. Dates, fondateurs et lieu d'origine restent à confirmer par le propriétaire.",tj_t:"Le tajine, de près",tj_p:"Faites-le tourner, soulevez le couvercle : poulet fermier, citron confit et olives.",tj_btn:"Soulever le couvercle",tj_close:"Refermer",tj_start:"Lancer la vue 3D",tj_hint:"Glissez pour tourner, ou utilisez les flèches du clavier.",tj_fb:"La 3D n'est pas disponible sur cet appareil.",tj_add:"Ajouter au panier",sh_t:"À partager",sh_p:"Des assortiments pensés pour la table. Le prix est la somme des plats, sans remise.",sh1:"Pour deux",sh1d:"Deux tajines et deux thés à la menthe.",sh2:"En famille",sh2d:"Couscous royal, couscous aux sept légumes, tajine poulet, quatre harira et quatre thés.",sh3:"Entre amis",sh3d:"Grillade mixte, tanjia, pizza margherita et trois jus d'avocat.",sh_btn:"Ajouter au panier",fq_t:"Questions fréquentes",fq
